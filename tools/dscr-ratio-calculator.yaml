name: dscr-ratio-calculator
version: 1.0.0
description: "Calculates Debt Service Coverage Ratio (DSCR) from Net Operating Income and Total Debt Service"
input_schema:
  type: object
  properties:
    financials_json:
      type: string
      description: "JSON string containing net_operating_income and annual_debt_service"
  required:
    - financials_json
implementation:
  type: script
  path: dscr_ratio_calculator.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true

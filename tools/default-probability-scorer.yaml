name: default-probability-scorer
version: 1.0.0
description: "Calculates corporate debt-to-equity ratio and risk tier classification"
input_schema:
  type: object
  properties:
    balance_sheet_json:
      type: string
      description: "JSON string containing total_debt and equity_value in USD"
  required:
    - balance_sheet_json
implementation:
  type: script
  path: default_probability_scorer.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
